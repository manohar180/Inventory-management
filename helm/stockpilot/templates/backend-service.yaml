# ==============================================================================
# templates/backend-service.yaml — ClusterIP Service for FastAPI Backend
# WHY:  A Service gives the backend a stable internal DNS name
#       (stockpilot-backend.stockpilot.svc.cluster.local) so the Ingress and
#       other pods can reach it even when pods are replaced.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "stockpilot.backendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
