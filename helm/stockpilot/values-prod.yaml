# values-prod.yaml - production overrides (image tags are rewritten by CI)
replicaCount: 2

backend:
  image:
    repository: ghcr.io/manohar180/stockpilot-backend
    tag: "19ba07ee7b0fdbd7cfdbc2046478d39f47a04e08"

frontend:
  image:
    repository: ghcr.io/manohar180/stockpilot-frontend
    tag: "19ba07ee7b0fdbd7cfdbc2046478d39f47a04e08"

ingress:
  host: ""        # empty = match any host, so the AWS load balancer address works in a browser

monitoring:
  serviceMonitor:
    enabled: true # requires kube-prometheus-stack to be installed first
